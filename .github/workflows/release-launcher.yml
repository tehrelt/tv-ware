name: Release TV Launcher

on:
  push:
    branches: [main]
    paths:
      - 'tv-launcher/**'
      - '.github/workflows/release-launcher.yml'
  workflow_dispatch:

concurrency:
  group: release-launcher
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Configure release signing
        working-directory: tv-launcher
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PROPERTIES" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
            printf '%s' "$KEYSTORE_PROPERTIES" | base64 --decode > keystore.properties
          elif [[ -n "$KEYSTORE_BASE64" || -n "$KEYSTORE_PROPERTIES" ]]; then
            printf '%s\n' 'Release signing requires both KEYSTORE_BASE64 and KEYSTORE_PROPERTIES, or neither.' >&2
            exit 1
          fi
      - name: Build launcher APK
        working-directory: tv-launcher
        run: ./gradlew --console=plain -PlauncherBuildNumber="$GITHUB_RUN_NUMBER" :app:checkReleaseAarMetadata :app:assembleRelease
      - name: Stage launcher APK
        run: cp tv-launcher/app/build/outputs/apk/release/app-release.apk tv-launcher.apk
      - name: Publish versioned launcher release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: launcher-v1.0.${{ github.run_number }}
          name: TV Launcher 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          fail_on_unmatched_files: true
          files: tv-launcher.apk
      - name: Update launcher download for existing installers
        uses: softprops/action-gh-release@v3
        with:
          tag_name: launcher-latest
          make_latest: false
          fail_on_unmatched_files: true
          files: tv-launcher.apk
